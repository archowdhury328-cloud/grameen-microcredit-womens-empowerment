name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install from the lock file
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests
      - name: Tests with coverage (fails under 80%)
        run: pytest
      - name: Reproduce the paper's summary figures
        run: grameen reproduce-paper --out "$RUNNER_TEMP/published"
      - name: Synthetic regression report
        run: grameen run-synthetic --out "$RUNNER_TEMP/synthetic"
      - name: Bundled data validates
        run: grameen validate-data
